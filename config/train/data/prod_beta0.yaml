dataset:
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  # frameskip=1: each action is already a delta pose (no temporal stacking needed).
  # Increase if rendering FPS is high and you want sparser observation sampling.
  frameskip: 1
  name: prod_beta0
  keys_to_load:
    - pixels
    - action
  keys_to_cache:
    - action
