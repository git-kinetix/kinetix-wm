defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

# VJEPA encoder options (set encoder_type=vjepa to use)
encoder_type: vit_hf
vjepa_checkpoint: null
encoder_frozen: false
encoder_pooling: cls

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

clearml:
  enabled: false
  project: lewm
  task_name: ${output_model_name}
  # ClearML Dataset ID for auto-download of training data
  dataset_id: null
  # Tags applied to the ClearML task
  tags: []
  # Upload final checkpoint as ClearML output model
  upload_model: true

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
  # hidden_dim_override: null  # set to decouple predictor width from encoder

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
